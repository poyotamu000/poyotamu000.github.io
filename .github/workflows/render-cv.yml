name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "_data/awards.yml"
      - "_data/grants.yml"
      - "_data/media.yml"
      - "_bibliography/papers.bib"
      - "bin/generate_rendercv_input.py"
      - "assets/rendercv/design.yaml"
      - "assets/rendercv/locale.yaml"
      - "assets/rendercv/settings.yaml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV (English + Bilingual)
        run: |
          render_out_dir="assets/rendercv/rendercv_output"
          # Clean stale/template PDFs so only intended outputs remain.
          rm -f "$render_out_dir"/*_CV.pdf "$render_out_dir"/cv_english.pdf "$render_out_dir"/cv_bilingual.pdf
          rendercv_dir=$(find assets -maxdepth 1 -type d -name "rendercv")
          if [ -z "$rendercv_dir" ]; then
            echo "No RenderCV config directory found!"
            exit 1
          fi
          settings=$(find $rendercv_dir -maxdepth 1 -type f \( -name "settings.yaml" -o -name "settings.yml" \))
          if [ -z "$settings" ]; then
            echo "Missing RenderCV config file!"
            exit 1
          fi
          design=$(find $rendercv_dir -maxdepth 1 -type f \( -name "design.yaml" -o -name "design.yml" \))
          if [ -z "$design" ]; then
            echo "Missing RenderCV design file!"
            exit 1
          fi

          render_profile () {
            profile="$1"
            tmp_input="_data/cv.rendercv.${profile}.yml"
            target_pdf="$render_out_dir/cv_${profile}.pdf"

            marker_file=$(mktemp)
            # Ensure marker is strictly older than generated outputs.
            sleep 1

            python3 bin/generate_rendercv_input.py --input _data/cv.yml --output "$tmp_input" --profile "$profile"
            if [ ! -f "$tmp_input" ]; then
              echo "Generated RenderCV input was not found: $tmp_input"
              exit 1
            fi

            rendercv render "$tmp_input" --settings "$settings" --design "$design"
            new_pdf=$(find "$render_out_dir" -maxdepth 1 -type f -name "*_CV.pdf" -newer "$marker_file" | head -n 1)
            if [ -z "$new_pdf" ]; then
              new_pdf=$(ls -t "$render_out_dir"/*_CV.pdf 2>/dev/null | head -n 1)
            fi
            if [ -z "$new_pdf" ]; then
              echo "No rendered PDF found in $render_out_dir after rendering profile '$profile'"
              exit 1
            fi

            cp "$new_pdf" "$target_pdf"
            rm -f "$tmp_input"
            rm -f "$marker_file"
          }

          render_profile "english"
          render_profile "bilingual"
          rm -f "$render_out_dir"/*_CV.pdf
          rm assets/rendercv/rendercv_output/*.typ
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: render the latest CV"
          git push
