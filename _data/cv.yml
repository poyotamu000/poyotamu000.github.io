    Publications:
      - title: Exploring the proprioceptive potential of joint receptors using a biomimetic robotic joint
        authors:
          - Akihiro Miki
          - Shun Hasegawa
          - Sota Yuzaki
          - Yuta Sahara
          - Yoshimoto Ribayashi
          - Kento Kawaharazuka
          - Kei Okada
        journal: Scientific Reports | Vol. 16, No. 1, pp. 4724
        date: 2026
        url: https://doi.org/10.1038/s41598-025-27311-3
        summary: "Category: Biological Understanding via Robotics | Abstract: This study builds a biomimetic robotic joint to evaluate how joint receptor arrangements can encode proprioceptive signals and contribute to constructive understanding of biological sensing mechanisms."

      - title: Development of a Hardware-abstracted Device Control Platform that Enables Handling of a Variety of Robots while Providing High Responsivity
        authors:
          - Akihiro Miki
          - Yuya Nagamatsu
          - Masahiro Bando
          - Kento Kawaharazuka
          - Yasunori Toshimitsu
          - Naoki Hiraoka
          - Kei Okada
          - Masayuki Inaba
        journal: Journal of the Robotics Society of Japan | Vol. 43, No. 1, pp. 75-86
        date: 2025
        url: https://doi.org/10.7210/jrsj.43.75
        summary: "Category: Robot Systems | Abstract: This paper presents a high-responsivity hardware-abstracted device-control platform that standardizes heterogeneous robot hardware interfaces and enables robust operation across diverse robotic systems."

      - title: Designing Fluid-Exuding Cartilage for Biomimetic Robots Mimicking Human Joint Lubrication Function
        authors:
          - Akihiro Miki
          - Yuta Sahara
          - Kazuhiro Miyama
          - Shunnosuke Yoshimura
          - Yoshimoto Ribayashi
          - Kento Kawaharazuka
          - Shun Hasegawa
          - Kei Okada
          - Masayuki Inaba
        journal: Proceedings of the 2024 IEEE-RAS International Conference on Soft Robotics | pp. 452-459
        date: 2024
        url: https://doi.org/10.1109/robosoft60065.2024.10521920
        summary: "Category: Biomimetics | Abstract: We propose and validate a fluid-exuding artificial cartilage structure that reproduces key human joint lubrication behavior, improving durability and biomimetics functionality in robotic joint systems."

      - title: System Architecture and Real-World Task Realization of Musculoskeletal Wheeled Robot Musashi-W with Various Hardware Components
        authors:
          - Akihiro Miki
          - Kento Kawaharazuka
          - Masahiro Bando
          - Kei Okada
          - Koji Kawasaki
          - Masayuki Inaba
        journal: Intelligent Autonomous Systems 18 | pp. 109-122
        date: 2024
        url: https://doi.org/10.1007/978-3-031-44851-5_9
        summary: "Category: Musculoskeletal Systems | Abstract: This work details the system architecture of the Musashi-W musculoskeletal wheeled robot and demonstrates integration of multiple hardware components for stable real-world task execution."

